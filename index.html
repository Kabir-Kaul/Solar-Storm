<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Storm: Moon Base Survival</title>
<meta name="description" content="A junior astronaut mission trainer: keep your Moon base crew safe from a real solar storm recorded by NASA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="app">
  <div id="hud" hidden><div class="inner" id="hud-inner"></div></div>
  <main id="screen" aria-live="polite"></main>
</div>
<button id="home-btn" class="icon-btn" data-act="quit" aria-label="Quit to title screen" title="Quit to title">🏠</button>
<button id="sound-toggle" class="icon-btn" data-act="sound" aria-label="Turn sound off" title="Sound">🔊</button>
<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="box panel" id="modal-box"></div></div>
<noscript><p style="padding:20px">This game needs JavaScript turned on.</p></noscript>

<script src="app.js"></script>
</body>
</html>
