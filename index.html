<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar Storm: Moon Base Survival</title>
<meta name="description" content="A junior astronaut mission trainer: keep your Moon base crew safe from a real solar storm recorded by NASA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=5">
<link rel="stylesheet" href="scramble.css?v=5">
</head>
<body>
<div id="apod" aria-hidden="true"></div>
<canvas id="sky" aria-hidden="true"></canvas>
<div id="app">
  <div id="hud" hidden><div class="inner" id="hud-inner"></div></div>
  <main id="screen" aria-live="polite"></main>
</div>
<div id="apod-credit"></div>
<button id="home-btn" class="icon-btn" data-act="quit" aria-label="Quit to title screen" title="Quit to title">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V18a2 2 0 0 1-2 2h-3v-7H9v7H6a2 2 0 0 1-2-2v-7.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
</button>
<button id="sound-toggle" class="icon-btn" data-act="sound" aria-label="Turn sound off" title="Sound">
  <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
</button>
<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="box panel" id="modal-box"></div></div>
<noscript><p style="padding:20px">This game needs JavaScript turned on.</p></noscript>

<script src="pixel.js?v=5"></script>
<script src="app.js?v=5"></script>
<script src="scramble.js?v=5"></script>
</body>
</html>
